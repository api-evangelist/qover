apis:
- name: Qover Embedded Insurance API
  description: >-
    Qover's REST API for embedded insurance: a Claims API (file, retrieve, track
    status history, and download claim reports), a Policy API (manage policies and
    dynamically add/remove risk items), and a Document Asset Management (DAM) API
    for claim attachments. Authenticated with API keys in the request header,
    versioned in the URI path (v1), with configurable webhooks for claim status
    changes. Product/country behaviour is driven by per-partner product
    configuration (e.g. FINTECHX, BE).
  humanURL: https://docs.qover.com/
  baseURL: https://api.sbx.qover.io
