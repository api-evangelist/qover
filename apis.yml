aid: qover
name: Qover
description: >-
  Qover is a Brussels-based insurtech providing an API-first embedded insurance
  orchestration platform used across 32 European countries. Its modular platform
  lets brands, fintechs and insurers configure and distribute insurance products
  (travel, mobility, bike, purchase protection, accident, property) and run the
  full lifecycle from policy configuration and issuance through AI-assisted claims
  and multilingual customer care. Qover exposes REST APIs - a Claims API, a Policy
  API and a Document Asset Management API - secured with API keys, with a sandbox
  environment, configurable webhooks for claim status changes, and per-partner
  product configuration. Founded in 2016, Qover reports serving 440+ brands and
  insurers covering millions of people, and is an ISO-certified company with a
  Vanta-hosted trust center.
